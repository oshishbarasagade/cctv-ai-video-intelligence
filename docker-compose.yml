services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      # Provide these to switch off offline mode:
      # - SUPABASE_URL=
      # - SUPABASE_SERVICE_ROLE_KEY=
      # - CLAUDE_API_KEY=
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

# The processing worker runs in-process in the backend (FastAPI BackgroundTasks)
# in offline mode. For a dedicated queue worker later, add a `worker` service
# using the same backend image with a different command.
